<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Ship Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2e;
    --panel-alt: #16213a;
    --border: #223154;
    --text: #e6ecf5;
    --muted: #8ca0c4;
    --accent: #33c7ff;
    --live: #2ecc71;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  #app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

  #sidebar {
    width: 360px;
    min-width: 360px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #sidebar-header { padding: 16px 16px 8px; border-bottom: 1px solid var(--border); }
  #sidebar-header h1 { font-size: 18px; margin: 0 0 4px; }
  #status-line { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #e74c3c; display: inline-block; }
  #status-dot.ok { background: var(--live); }

  #search-row { display: flex; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  #search-input {
    flex: 1; background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-size: 13px;
  }
  #search-input:focus { outline: none; border-color: var(--accent); }
  #track-btn {
    background: var(--accent); color: #06131f; border: none; padding: 8px 14px;
    border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  #track-btn:hover { filter: brightness(1.1); }

  #ship-count { padding: 8px 16px; font-size: 12px; color: var(--muted); }

  #ship-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .ship-card {
    background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s, transform .1s;
  }
  .ship-card:hover { border-color: var(--accent); }
  .ship-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: #182642; }
  .ship-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .ship-name { font-weight: 600; font-size: 14px; }
  .live-pill {
    font-size: 10px; font-weight: 700; letter-spacing: .04em; color: #06301c; background: var(--live);
    padding: 2px 6px; border-radius: 10px;
  }
  .ship-meta { font-size: 12px; color: var(--muted); display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
  .ship-meta span.label { color: #5f7aa8; }

  #empty-state { padding: 24px 16px; color: var(--muted); font-size: 13px; text-align: center; }

  #map { flex: 1; height: 100vh; background: #0e1626; }

  @media (max-width: 720px) {
    #sidebar { width: 280px; min-width: 280px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>🛰️ Live Ship Tracker</h1>
      <div id="status-line"><span id="status-dot"></span><span id="status-text">Connecting…</span></div>
    </div>
    <div id="search-row">
      <input id="search-input" type="text" placeholder="Search MMSI…" />
      <button id="track-btn">Track</button>
    </div>
    <div id="ship-count">0 vessels tracked</div>
    <div id="ship-list"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const API_BASE = window.location.origin || 'http://localhost:3000';
  const POLL_INTERVAL_MS = 3000;

  const map = L.map('map', { zoomControl: true }).setView([25.72, -80.04], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  // mmsi -> { marker, polyline, data }
  const shipLayers = new Map();
  let selectedMmsi = null;

  const shipListEl = document.getElementById('ship-list');
  const shipCountEl = document.getElementById('ship-count');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const searchInput = document.getElementById('search-input');
  const trackBtn = document.getElementById('track-btn');

  function headingColor(speed) {
    if (speed === null || speed === undefined) return '#8ca0c4';
    if (speed < 1) return '#8ca0c4';
    if (speed < 10) return '#33c7ff';
    return '#2ecc71';
  }

  function upsertMarker(ship) {
    const { mmsi, latitude, longitude, history } = ship;
    if (typeof latitude !== 'number' || typeof longitude !== 'number') return;

    let entry = shipLayers.get(mmsi);
    if (!entry) {
      const marker = L.circleMarker([latitude, longitude], {
        radius: 6,
        weight: 2,
        color: '#06131f',
        fillColor: headingColor(ship.speed),
        fillOpacity: 0.9,
      }).addTo(map);

      marker.on('click', () => selectShip(mmsi));

      const polyline = L.polyline(history && history.length ? history : [[latitude, longitude]], {
        color: '#33c7ff',
        weight: 2,
        opacity: 0.6,
        dashArray: '4 6',
      }).addTo(map);

      entry = { marker, polyline };
      shipLayers.set(mmsi, entry);
    } else {
      entry.marker.setLatLng([latitude, longitude]);
      entry.marker.setStyle({ fillColor: headingColor(ship.speed) });
      if (history && history.length) entry.polyline.setLatLngs(history);
    }

    entry.marker.bindPopup(popupHtml(ship));
  }

  function popupHtml(ship) {
    const name = ship.shipName || 'Unknown vessel';
    const speed = ship.speed !== null && ship.speed !== undefined ? ship.speed.toFixed(1) : '—';
    const course = ship.course !== null && ship.course !== undefined ? ship.course.toFixed(0) : '—';
    return `<strong>${escapeHtml(name)}</strong><br/>MMSI: ${ship.mmsi}<br/>Speed: ${speed} kn &middot; Course: ${course}&deg;`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderSidebar(ships) {
    shipCountEl.textContent = `${ships.length} vessel${ships.length === 1 ? '' : 's'} tracked`;

    if (ships.length === 0) {
      shipListEl.innerHTML = '<div id="empty-state">No vessels received yet. Waiting for AIS data…</div>';
      return;
    }

    shipListEl.innerHTML = '';
    ships
      .slice()
      .sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0))
      .forEach((ship) => {
        const card = document.createElement('div');
        card.className = 'ship-card' + (ship.mmsi === selectedMmsi ? ' active' : '');
        card.dataset.mmsi = ship.mmsi;

        const name = ship.shipName || `MMSI ${ship.mmsi}`;
        const speed = ship.speed !== null && ship.speed !== undefined ? ship.speed.toFixed(1) : '—';
        const course = ship.course !== null && ship.course !== undefined ? ship.course.toFixed(0) : '—';
        const lat = typeof ship.latitude === 'number' ? ship.latitude.toFixed(4) : '—';
        const lon = typeof ship.longitude === 'number' ? ship.longitude.toFixed(4) : '—';

        card.innerHTML = `
          <div class="ship-card-top">
            <span class="ship-name">${escapeHtml(name)}</span>
            <span class="live-pill">LIVE</span>
          </div>
          <div class="ship-meta">
            <span><span class="label">MMSI:</span> ${ship.mmsi}</span>
            <span><span class="label">Speed:</span> ${speed} kn</span>
            <span><span class="label">Course:</span> ${course}&deg;</span>
            <span><span class="label">Pos:</span> ${lat}, ${lon}</span>
          </div>
        `;

        card.addEventListener('click', () => selectShip(ship.mmsi));
        shipListEl.appendChild(card);
      });
  }

  function selectShip(mmsi) {
    selectedMmsi = mmsi;
    const entry = shipLayers.get(mmsi);
    if (entry) {
      const latlng = entry.marker.getLatLng();
      map.flyTo(latlng, 14);
      entry.marker.openPopup();
    }
    document.querySelectorAll('.ship-card').forEach((c) => {
      c.classList.toggle('active', Number(c.dataset.mmsi) === Number(mmsi));
    });
  }

  function setConnectionStatus(ok) {
    statusDot.classList.toggle('ok', ok);
    statusText.textContent = ok ? 'Live — polling every 3s' : 'Disconnected from backend';
  }

  async function pollShips() {
    try {
      const res = await fetch(`${API_BASE}/api/ships`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { data } = await res.json();
      setConnectionStatus(true);

      const seenMmsi = new Set();
      data.forEach((ship) => {
        seenMmsi.add(ship.mmsi);
        upsertMarker(ship);
      });

      // Remove markers for vessels no longer returned by the backend (purged/stale).
      for (const mmsi of Array.from(shipLayers.keys())) {
        if (!seenMmsi.has(mmsi)) {
          const entry = shipLayers.get(mmsi);
          map.removeLayer(entry.marker);
          map.removeLayer(entry.polyline);
          shipLayers.delete(mmsi);
        }
      }

      renderSidebar(data);
    } catch (err) {
      console.error('Polling error:', err);
      setConnectionStatus(false);
    }
  }

  function trackByMmsi() {
    const query = searchInput.value.trim();
    if (!query) return;
    const mmsi = Number(query);
    if (shipLayers.has(mmsi)) {
      selectShip(mmsi);
    } else {
      alert(`No vessel currently tracked with MMSI ${mmsi}`);
    }
  }

  trackBtn.addEventListener('click', trackByMmsi);
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') trackByMmsi();
  });

  pollShips();
  setInterval(pollShips, POLL_INTERVAL_MS);
</script>
</body>
</html>
